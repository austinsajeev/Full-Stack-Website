<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVM Ballot Unit Simulator</title>
    <style>
        :root {
            --evm-beige: #d8d0b8;
            --evm-dark-beige: #c0bba6;
            --evm-blue-btn: #2d5895;
            --led-red-off: #4a0000;
            --led-red-on: #ff0000;
            --led-green-off: #003300;
            --led-green-on: #00ff00;
        }

        body {
            font-family: sans-serif;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Main Casing */
        .evm-casing {
            background-color: var(--evm-beige);
            width: 380px;
            padding: 20px;
            border-radius: 15px;
            border: 3px solid #999;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
        }

        /* The left side cable area hint */
        .casing-left-edge {
            position: absolute;
            left: -15px;
            top: 50px;
            bottom: 50px;
            width: 15px;
            background-color: #999;
            border-radius: 10px 0 0 10px;
            border: 2px solid #777;
        }

        /* Header Section (Ready Light & Labels) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #aaa;
            padding-bottom: 10px;
        }

        .header-left, .header-right {
            font-weight: bold;
            color: #333;
        }

        .ready-status {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 1.2em;
        }

        /* LED lamp styling */
        .led-lamp {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin: 0 10px;
            border: 2px solid #555;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }

        #ready-led {
            background-color: var(--led-green-off);
        }
        #ready-led.on {
            background-color: var(--led-green-on);
            box-shadow: 0 0 15px var(--led-green-on), inset 2px 2px 5px rgba(255,255,255,0.5);
        }

        .unit-number-box {
            background-color: #333;
            color: white;
            padding: 2px 6px;
            border: 1px solid #000;
        }

        /* Candidate List Structure */
        .candidate-list {
            background-color: #fff;
            border: 2px solid #aaa;
        }

        .candidate-row {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #ccc;
            height: 60px;
        }

        .candidate-row.header-row {
            background-color: #eee;
            height: 30px;
            font-size: 0.8em;
            font-weight: bold;
        }

        /* Columns */
        .col-sl { width: 40px; text-align: center; border-right: 1px solid #ccc; height: 100%; display: flex; align-items: center; justify-content: center;}
        .col-name { flex-grow: 2; padding-left: 10px; border-right: 1px solid #ccc; height: 100%; display: flex; align-items: center;}
        .col-symbol { width: 60px; text-align: center; font-size: 1.5em; border-right: 1px solid #ccc; height: 100%; display: flex; align-items: center; justify-content: center;}
        .col-action { flex-grow: 1; display: flex; align-items: center; justify-content: space-around; background-color: var(--evm-beige); padding: 0 10px; height: 100%;}

        /* Candidate LED */
        .candidate-led {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: var(--led-red-off);
            border: 2px solid #555;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
        }

        .candidate-led.on {
            background-color: var(--led-red-on);
            box-shadow: 0 0 15px var(--led-red-on), inset 2px 2px 5px rgba(255,255,255,0.5);
        }

        /* Blue Vote Button */
        .vote-button {
            width: 90px;
            height: 40px;
            background-color: var(--evm-blue-btn);
            border: 3px solid #1a3a65;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: inset 0 5px 10px rgba(255,255,255,0.2), 0 3px 5px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }

        .vote-button:active {
            transform: scale(0.97);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        
        /* Styling for empty/dummy rows */
        .empty-row .col-sl, .empty-row .col-name, .empty-row .col-symbol {
            background-color: var(--evm-beige); /* Hides the white paper area */
            border-right: none;
        }
        .empty-row .vote-button {
            background-color: var(--evm-dark-beige);
            border-color: #999;
            cursor: default;
            box-shadow: none;
        }
         .empty-row .vote-button:active {
             transform: none;
         }

        /* Status message area below */
        #sim-status {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-family: monospace;
        }
    </style>
</head>

</div>

<script>
    let isReady = true;

    function castVote(candidateId) {
        if (!isReady) return; // Prevent multiple clicks if machine is locked

        // 1. Lock the machine
        isReady = false;

        // 2. Visual changes: Turn off Ready light, Turn on Candidate light
        document.getElementById('ready-led').classList.remove('on');
        document.getElementById('led-' + candidateId).classList.add('on');
        
        // Update Status
        document.getElementById('sim-status').innerText = "Vote Cast for Candidate " + candidateId + ". Machine Locked.";

        // 3. Play Audio
        const audio = document.getElementById('beep-sound');
        if(audio) {
            audio.currentTime = 0;
            audio.play();
        }

        // 4. Auto-Reset Timer (Simulates the Control Unit resetting the Ballot Unit)
        setTimeout(() => {
            resetMachine(candidateId);
        }, 5000); // Machine stays locked for 5 seconds
    }

    function resetMachine(lastCandidateId) {
        // Turn off candidate light
        document.getElementById('led-' + lastCandidateId).classList.remove('on');
        
        // Turn on Ready light
        document.getElementById('ready-led').classList.add('on');
        
        // Reset Text and State
        document.getElementById('sim-status').innerText = "Simulator Status: Machine Ready. Please cast a vote.";
        isReady = true;
    }
</script>
